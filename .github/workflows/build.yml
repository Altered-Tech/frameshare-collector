name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install SDL2 + Fyne native dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libsdl2-dev libgl1-mesa-dev xorg-dev

      - name: Install SDL2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config sdl2

      # cmd/gui-spike and internal/controllerinput need SDL2 dev headers,
      # which aren't wired up for windows-latest yet -- see #32. Vet/test
      # everything else there so that work isn't blocked on it.
      - name: Vet
        if: matrix.os != 'windows-latest'
        run: go vet ./...

      - name: Vet (windows, excluding SDL2-dependent packages)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go vet $(go list ./... | grep -v -e cmd/gui-spike -e internal/controllerinput)

      - name: Test
        if: matrix.os != 'windows-latest'
        run: go test ./...

      - name: Test (windows, excluding SDL2-dependent packages)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test $(go list ./... | grep -v -e cmd/gui-spike -e internal/controllerinput)

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Vet
        # This job only builds cmd/collector's release binaries, and does so
        # with CGO_ENABLED=0 -- scope vet to match. The full module (which
        # now includes cgo-based Fyne/SDL2 packages, see #36) is vetted by
        # the test job above instead.
        run: go vet ./cmd/collector/...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=dev-$(git rev-parse --short HEAD)" \
            -o dist/collector-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/collector

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collector-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/collector-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
